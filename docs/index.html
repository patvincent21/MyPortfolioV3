<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>myportfolio</title>
    <!-- Load OpenUI5 from the official CDN so Pages can serve the app without bundling UI5 locally -->
    <script
      id="sap-ui-bootstrap"
      src="https://openui5.hana.ondemand.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_fiori_3"
      data-sap-ui-libs="sap.m"
      data-sap-ui-resourceroots='{"myportfolio": "./"}'
      data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-frameOptions="trusted"
    ></script>
  </head>
  <body class="sapUiBody portfolioBody" id="content">
    <div
      data-sap-ui-component
      data-name="myportfolio"
      data-id="container"
      data-settings='{"id" : "myportfolio"}'
    ></div>
  </body>
</html>
